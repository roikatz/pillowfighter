# Sample cb-loadgen configuration. Copy to config.yaml and adjust, then run:
#   cb-loadgen run --config config/config.yaml
#
# CLI flags always override values from this file; this file overrides the
# built-in defaults. The password is intentionally left out here — set it via
# --password or the CB_PASSWORD environment variable instead of committing it.

connection-string: "couchbase://localhost?kv_pool_size=8"
username: Administrator
bucket: benchmark
scope: _default
collection: _default

num-kv-connections: 8
kv-timeout: 2.5s
compression: true
durability: none

workload: mixed
mix: "80:20"
num-docs: 100000
duration: 0s
# Run until interrupted (Ctrl+C/SIGTERM) instead of stopping at num-docs.
# Mutually exclusive with duration; num-docs still bounds the finite keyspace.
infinite: false
# Offset key numbering so a run targets a fresh range instead of overwriting
# earlier data (e.g. 10000000 writes keys 10000000..10099999 with the num-docs
# above).
start-index: 0
doc-size: 1024

concurrency: 256
warmup: 5s
report-interval: 1s

output: json
output-file: results/run.json
